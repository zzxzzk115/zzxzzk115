name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - README.template.md
      - scripts/update-stars.mjs
      - scripts/update-stars.test.mjs
      - scripts/update-pacman.mjs
      - .github/workflows/update-stars.yml

permissions:
  contents: write

concurrency:
  group: profile-star-badges
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test badge visibility rules
        run: node --test scripts/update-stars.test.mjs
      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stars.mjs
      - name: Generate Pac-Man contribution graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-pacman.mjs
      - name: Commit profile updates
        run: |
          git add -- README.md assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
          if git diff --cached --quiet; then
            echo "Profile is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile badges and contribution graph"
          git push
